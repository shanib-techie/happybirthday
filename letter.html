<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your letter</title>
<link rel="stylesheet" href="style.css" />
<script src="config.js"></script>
<style>
  .stage{ align-items:flex-start; padding-top: 70px; padding-bottom: 90px; }

  .letter-wrap{
    display:flex;
    gap: 30px;
    align-items:flex-start;
    max-width: 820px;
    width: 100%;
    position:relative;
    z-index:2;
  }

  .paper{
    background: var(--cream);
    color: var(--ink);
    flex: 1.5;
    padding: 42px 36px 36px;
    position:relative;
    box-shadow: 0 26px 55px var(--shadow);
    clip-path: polygon(
      0% 2%, 4% 0%, 9% 3%, 14% 0%, 19% 3%, 24% 0%, 29% 3%, 34% 0%, 39% 3%, 44% 0%,
      49% 3%, 54% 0%, 59% 3%, 64% 0%, 69% 3%, 74% 0%, 79% 3%, 84% 0%, 89% 3%, 94% 0%, 100% 2%,
      100% 100%, 0% 100%
    );
    opacity: 0;
    animation: paperIn .8s ease forwards .1s;
  }
  @keyframes paperIn{ from{ opacity:0; transform: translateY(24px) rotate(-.6deg);} to{ opacity:1; transform:none; } }

  .paper-title{ text-align:center; margin-bottom: 6px; }
  .paper-title .eyebrow{ font-size: 11px; letter-spacing:.3em; color: #a0885f; display:block; }
  .paper-title .main{ font-family:'Dancing Script', cursive; font-size: 30px; color: var(--maroon); }

  .greet-name{
    text-align:center;
    font-family:'Dancing Script', cursive;
    font-size: 26px;
    font-weight:700;
    margin: 6px 0 18px;
    background: linear-gradient(100deg, var(--maroon) 20%, #c98a3f 45%, var(--maroon) 70%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: nameShimmer 4.5s linear infinite;
    text-shadow: 0 0 18px rgba(207,159,78,.25);
  }
  @keyframes nameShimmer{ to{ background-position: -220% 0; } }

  .paper-body{ font-size: 12.5px; line-height: 1.9; color: #4a3626; white-space: pre-line; }
  .paper-sign{ margin-top: 18px; font-family:'Dancing Script', cursive; font-size: 20px; color: var(--maroon); text-align:right; }
  .fav-heart{ position:absolute; top:14px; left:16px; font-size: 16px; color: var(--maroon-light); opacity:.75; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.25);} }

  .photo-col{ flex:1; display:flex; flex-direction:column; gap: 18px; }
  .photo-card{
    background: var(--cream);
    padding: 9px 9px 24px;
    border-radius: 3px;
    box-shadow: 0 16px 34px var(--shadow);
    transform: rotate(2deg);
    opacity: 0;
    animation: cardIn .7s ease forwards;
    transition: transform .3s ease;
  }
  .photo-card:hover{ transform: rotate(0deg) scale(1.04) !important; }
  .photo-card:nth-child(1){ animation-delay: .3s; }
  .photo-card:nth-child(2){ animation-delay: .55s; transform: rotate(-2deg); }
  .photo-card:nth-child(3){ animation-delay: .8s; transform: rotate(2.5deg); }
  @keyframes cardIn{ from{ opacity:0; transform: translateY(18px) rotate(0deg);} to{ opacity:1; } }

  .photo-placeholder{
    height: 150px;
    border-radius: 2px;
    overflow: hidden;
    background: linear-gradient(135deg, #7a3242, #4a1420);
  }
  .photo-placeholder img{ width:100%; height:100%; object-fit: cover; display:block; }
  .photo-caption{ text-align:center; font-family:'Dancing Script', cursive; font-size: 15px; color:#7a6a55; margin-top: 9px; }

  .surprise-link{
    position: fixed;
    top: 20px; right: 22px;
    z-index: 6;
    font-size: 12px;
    letter-spacing:.05em;
    color: var(--gold-soft);
    background: rgba(74,15,24,0.55);
    border: 1px solid rgba(207,159,78,0.45);
    padding: 9px 16px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    animation: linkFloat 2.4s ease-in-out infinite;
  }
  @keyframes linkFloat{ 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-4px);} }

  .music-toggle{
    position:fixed;
    top: 18px; left: 18px;
    width: 40px; height:40px;
    border-radius: 50%;
    background: rgba(246,239,223,0.12);
    border: 1px solid rgba(207,159,78,0.4);
    display:flex; align-items:center; justify-content:center;
    font-size: 16px;
    z-index: 5;
  }

  @media (max-width: 680px){
    .letter-wrap{ flex-direction: column; }
    .photo-col{ flex-direction:row; flex-wrap:wrap; }
    .photo-card{ flex: 1 1 45%; }
    .photo-placeholder{ height: 130px; }
    .surprise-link{
      position: static;
      display:block;
      width: fit-content;
      margin: 26px auto 0;
      text-align:center;
      animation: none;
    }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="sparkles" id="sparkles"></div>
  <button class="music-toggle" id="musicToggle" title="music">♪</button>
  <a class="surprise-link" href="loading.html?next=wish.html">🎁 tap here for a surprise →</a>

  <div class="letter-wrap">
    <div class="paper">
      <div class="fav-heart">♡</div>
      <div class="paper-title">
        <span class="eyebrow">HAPPY</span>
        <span class="main" id="letterTitle">Birthday</span>
      </div>
      <div class="greet-name" id="greetName">Bubo</div>
      <div class="paper-body" id="letterBody"></div>
      <div class="paper-sign" id="letterSignoff"></div>
    </div>

    <div class="photo-col" id="photoCol"></div>
  </div>
</div>

<audio id="bgAudio" loop>
  <!-- Optional: drop a file at music/song.mp3 and it will play here -->
  <source src="music/song.mp3" type="audio/mpeg" />
</audio>

<script src="script.js"></script>
<script>
  document.getElementById("letterTitle").textContent = SURPRISE_CONFIG.letterTitle;
  document.getElementById("greetName").textContent = SURPRISE_CONFIG.recipientName;
  document.getElementById("letterBody").textContent = SURPRISE_CONFIG.letterBody;
  document.getElementById("letterSignoff").textContent = "— " + SURPRISE_CONFIG.letterSignoff;

  const photoCol = document.getElementById("photoCol");
  SURPRISE_CONFIG.photos.slice(0, 3).forEach((p) => {
    const card = document.createElement("div");
    card.className = "photo-card";
    card.innerHTML = `<div class="photo-placeholder"><img src="${p.url}" alt="${p.caption}"></div><div class="photo-caption">${p.caption}</div>`;
    photoCol.appendChild(card);
  });

  scatterSparkles(document.getElementById("sparkles"), 14);

  const audio = document.getElementById("bgAudio");
  const toggle = document.getElementById("musicToggle");
  let playing = false;
  toggle.addEventListener("click", () => {
    if (!playing) { audio.play().catch(()=>{}); toggle.textContent="❚❚"; }
    else { audio.pause(); toggle.textContent="♪"; }
    playing = !playing;
  });
</script>
</body>
</html>
