<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A card for you</title>
<link rel="stylesheet" href="style.css" />
<script src="config.js"></script>
<style>
  .card{
    background: var(--cream);
    color: var(--ink);
    width: min(420px, 88vw);
    padding: 42px 30px 34px;
    border-radius: 6px;
    text-align:center;
    box-shadow: 0 30px 60px var(--shadow);
    position:relative;
    z-index:2;
  }
  .card-title{
    font-family:'Dancing Script', cursive;
    font-size: 36px;
    color: var(--maroon);
    margin-bottom: 34px;
  }
  .card-title span{ display:block; font-size: 22px; margin-top:2px; }

  .envelope-wrap{
    width: 220px;
    height: 150px;
    margin: 0 auto;
    position: relative;
    cursor: pointer;
    perspective: 800px;
  }
  .env-body{
    position:absolute; inset:0;
    background: linear-gradient(160deg, var(--maroon-light), var(--maroon));
    border-radius: 4px;
    box-shadow: 0 14px 30px rgba(0,0,0,.25);
  }
  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-top: 78px solid var(--maroon-deep);
    transform-origin: top center;
    transition: transform .6s cubic-bezier(.6,-0.3,.4,1.3);
    z-index: 3;
  }
  .seal{
    position:absolute;
    top: 50%; left:50%;
    width: 42px; height:42px;
    background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 70%);
    border-radius: 50%;
    transform: translate(-50%,-50%);
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
    z-index: 4;
    transition: opacity .3s ease, transform .3s ease;
    display:flex; align-items:center; justify-content:center;
    font-size: 15px;
    color: var(--maroon-deep);
  }
  .letter-peek{
    position:absolute;
    left: 10px; right:10px; bottom: 6px;
    top: 26px;
    background: var(--cream);
    border-radius: 3px;
    box-shadow: 0 -2px 6px rgba(0,0,0,.15);
    transform: translateY(30%);
    transition: transform .5s ease .1s;
    z-index: 2;
  }

  .envelope-wrap.open .env-flap{ transform: rotateX(180deg); }
  .envelope-wrap.open .seal{ opacity:0; transform: translate(-50%,-50%) scale(.4); }
  .envelope-wrap.open .letter-peek{ transform: translateY(-14%); }

  .hint{
    margin-top: 26px;
    font-size: 12.5px;
    color: #7a6a55;
    letter-spacing: .04em;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="sparkles" id="sparkles"></div>
  <div class="card fade-in">
    <div class="card-title">Happy Birthday!<span id="nameSpan">Bubo</span></div>

    <div class="envelope-wrap" id="envelope">
      <div class="letter-peek"></div>
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="seal">💌</div>
    </div>

    <div class="hint" id="hint">tap the envelope to open it</div>
  </div>
</div>

<script src="script.js"></script>
<script>
  document.getElementById("nameSpan").textContent = SURPRISE_CONFIG.recipientName;
  scatterSparkles(document.getElementById("sparkles"), 16);

  const envelope = document.getElementById("envelope");
  const hint = document.getElementById("hint");
  let opened = false;

  envelope.addEventListener("click", () => {
    if (opened) return;
    opened = true;
    envelope.classList.add("open");
    hint.textContent = "opening…";
    setTimeout(() => {
      fireConfetti(2200);
      hint.textContent = "🎉 surprise! 🎉";
    }, 500);
    setTimeout(() => {
      window.location.href = "loading.html?next=message.html";
    }, 2200);
  });
</script>
</body>
</html>
